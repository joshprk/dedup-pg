name: Tests

on:
  push:
  pull_request:

jobs:
  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src
      DEDUP_PG_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --locked
      - run: uv run pytest -q tests/readme.py tests/postgres.py tests/test_postgres_concurrency.py
